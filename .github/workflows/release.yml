name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          cd web && pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package artifact
        run: |
          tar -czf openclaw-web-channel-${GITHUB_REF_NAME}.tar.gz \
            openclaw.plugin.json package.json README.md PROPOSAL.md src dist web

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: openclaw-web-channel-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
